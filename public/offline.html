<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1e1b4b" />
    <title>Nap Tracker — Offline</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: linear-gradient(to bottom, #1e1b4b, #0f0f23);
        color: #fff;
      }
      h1 { font-size: 1.5rem; margin: 0; }
      p { color: rgba(255, 255, 255, 0.65); max-width: 22rem; line-height: 1.5; }
      button {
        border: 0;
        border-radius: 9999px;
        background: #8b5cf6;
        color: #fff;
        font-weight: 600;
        padding: 0.75rem 2rem;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover { background: #7c3aed; }
    </style>
  </head>
  <body>
    <h1>You're offline</h1>
    <p>
      Nap Tracker needs a connection the very first time you open it. After
      that it runs offline — any naps or sleep you record while offline are
      saved on this device and sync automatically once you're back online.
    </p>
    <button onclick="location.reload()">Try again</button>
  </body>
</html>
